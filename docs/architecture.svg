<svg width="1200" height="330" viewBox="0 0 1200 330" fill="none" xmlns="http://www.w3.org/2000/svg"><rect width="1200" height="330" rx="18" fill="#20253D"/><text x="55" y="58" fill="white" font-family="Arial" font-size="25" font-weight="700">ClientFlow architecture</text><text x="55" y="85" fill="#AEB6CA" font-family="Arial" font-size="13">Authentication and organization boundaries are enforced on the server.</text><g font-family="Arial"><rect x="55" y="142" width="210" height="95" rx="12" fill="#303754"/><text x="80" y="175" fill="#A69CF2" font-size="11" font-weight="700">FRONTEND</text><text x="80" y="205" fill="white" font-size="18" font-weight="700">React + TypeScript</text><rect x="340" y="142" width="210" height="95" rx="12" fill="#7669E6"/><text x="365" y="175" fill="#E4E0FF" font-size="11" font-weight="700">API</text><text x="365" y="205" fill="white" font-size="18" font-weight="700">Express + Zod</text><rect x="625" y="142" width="210" height="95" rx="12" fill="#303754"/><text x="650" y="175" fill="#A69CF2" font-size="11" font-weight="700">SECURITY</text><text x="650" y="205" fill="white" font-size="18" font-weight="700">Session + roles</text><rect x="910" y="142" width="235" height="95" rx="12" fill="#1C3B39"/><text x="935" y="175" fill="#54CBAE" font-size="11" font-weight="700">DATABASE</text><text x="935" y="205" fill="white" font-size="18" font-weight="700">PostgreSQL</text></g><g stroke="#8E84F1" stroke-width="2"><path d="M280 190h50M565 190h50M850 190h50"/></g><g fill="#8E84F1"><path d="m320 184 10 6-10 6v-12Z"/><path d="m605 184 10 6-10 6v-12Z"/><path d="m890 184 10 6-10 6v-12Z"/></g><text x="55" y="282" fill="#AEB6CA" font-family="Arial" font-size="12">Every organization-owned query includes the authenticated membership's organization_id.</text></svg>
